global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: home

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: node
    static_configs:
      - targets: [127.0.0.1:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [127.0.0.1:8081]

  - job_name: pihole
    static_configs:
      - targets: [127.0.0.1:9617]

  - job_name: tailscale
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9002]

  - job_name: jellyfin
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:8096]

  - job_name: http-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1/admin/
          - http://127.0.0.1:8096/health
          - http://127.0.0.1:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: dns-probe
    metrics_path: /probe
    params:
      module: [dns_pihole]
    static_configs:
      - targets: [127.0.0.1:53]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
